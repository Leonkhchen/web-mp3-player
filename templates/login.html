<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>登入 — MP3 播放器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
       background:#f4f5f7;display:flex;align-items:center;justify-content:center;
       height:100vh;margin:0;}
  form{background:#fff;padding:2.5rem;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);
       width:320px;}
  h1{font-size:1.2rem;margin:0 0 1.2rem;color:#222;}
  input[type=password]{width:100%;padding:.7rem .9rem;border:1px solid #ddd;border-radius:8px;
       font-size:1rem;box-sizing:border-box;margin-bottom:1rem;}
  button{width:100%;padding:.7rem;background:#5b6cf3;color:#fff;border:none;border-radius:8px;
       font-size:1rem;cursor:pointer;}
  button:hover{background:#4a59e0;}
  .err{color:#d33;font-size:.9rem;margin-bottom:.8rem;}
</style>
</head>
<body>
  <form method="post" action="{{ url_for('login_post') }}">
    <h1>🔒 MP3 播放器</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="密碼" autofocus required>
    <button type="submit">登入</button>
  </form>
</body>
</html>
